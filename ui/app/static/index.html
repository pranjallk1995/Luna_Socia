<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna Socia</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/styles.css?v=__ASSETS__">
  <script src="/static/app.js?v=__ASSETS__" defer></script>
</head>
<body>
<div class="sc-app">
  <header class="sc-header">
    <button class="sc-avatar-button" type="button" id="profile-open" aria-label="Luna's profile picture">
      <img class="sc-avatar" id="avatar" src="/static/logo.png" alt="">
    </button>
    <div class="sc-who">
      <h1>Luna</h1>
      <p id="presence" role="status">online</p>
    </div>
    <div class="sc-header-actions">
      <button class="sc-icon" type="button" id="voice-toggle" aria-pressed="false" title="Read Luna's replies aloud">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <span class="sc-visually-hidden">Read replies aloud</span>
      </button>
      <button class="sc-icon" type="button" id="menu-open" title="Settings" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        <span class="sc-visually-hidden">Settings</span>
      </button>
    </div>
  </header>

  <main class="sc-thread" id="thread" aria-live="polite">
    <button class="sc-older" type="button" id="older" hidden>Earlier messages</button>
    <div id="messages"></div>
  </main>

  <form class="sc-composer" id="composer">
    <div class="sc-attachment" id="attachment" hidden>
      <img id="attachment-preview" alt="Photo to send">
      <button type="button" id="attachment-remove" aria-label="Remove photo">×</button>
    </div>
    <div class="sc-row">
      <label class="sc-icon" title="Send a photo">
        <input type="file" id="photo" accept="image/*" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        <span class="sc-visually-hidden">Send a photo</span>
      </label>
      <textarea id="text" rows="1" placeholder="Message Luna" aria-label="Message"></textarea>
      <button class="sc-icon" type="button" id="mic" title="Hold a voice message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0"/><path d="M12 17v5"/></svg>
        <span class="sc-visually-hidden">Voice message</span>
      </button>
      <button class="sc-send" type="submit" id="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z"/></svg>
      </button>
    </div>
  </form>
</div>

<dialog class="sc-dialog" id="menu">
  <form method="dialog" class="sc-dialog-body">
    <h2>Luna</h2>
    <img class="sc-profile-large" id="profile-large" alt="Luna's profile picture" hidden>
    <p class="sc-muted" id="profile-note">Her profile picture is her face in every picture she takes.</p>
    <label class="sc-button">
      <input type="file" id="profile-file" accept="image/*" hidden>
      Change her profile picture
    </label>
    <p class="sc-muted" id="model-note"></p>
    <button class="sc-button sc-danger" type="button" id="clear">Start the conversation over</button>
    <a class="sc-button" href="/logout">Sign out</a>
    <button class="sc-button" value="close">Close</button>
    <p class="sc-muted sc-brand">__BRAND__</p>
  </form>
</dialog>
</body>
</html>
